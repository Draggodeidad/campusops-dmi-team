# Generated by engineering-professor. This workflow is formative feedback.
# Final grading repeats critical checks in an instructor-controlled runner.
name: Week 03 Academic Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout submitted revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Accumulated tests through Week 03
        run: npm test -- --ci --runInBand
      - name: Evidence revalidation regression tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Architecture dependency boundaries
        run: npm run check:architecture
      - name: Secret scanning
        run: npm run scan:secrets
      - name: Critical dependency audit
        run: npm run audit:ci
      - name: Public Expo Android build
        run: npm run bundle:release
      - name: AC-01 — reproducibility
        run: make verify-week-03
      - name: AC-02 — public behavior
        run: npm test -- --ci --runInBand course-tests/public/week-03.test.ts
      - name: Validate final public evidence
        if: github.ref == 'refs/tags/week-03-final'
        run: make public-test-week-03
      - name: AC-03 — declared failure evidence
        if: github.ref == 'refs/tags/week-03-final'
        run: make evidence-week-03
      - name: Upload academic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-week-03-ci-amenazas
          if-no-files-found: warn
          path: |
            reports/week-03/**
            evidence/week-03/**
